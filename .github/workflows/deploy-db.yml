name: Deploy database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy-db:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project

      - name: Link the production project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: pnpm exec supabase db push --remote --dry-run --yes

      - name: Apply pending migrations
        run: pnpm exec supabase db push --remote --yes
